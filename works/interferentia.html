<style>
  :root{
    --ink: rgba(255,255,255,0.62);
    --ink-dim: rgba(255,255,255,0.30);
    --ink-faint: rgba(255,255,255,0.14);
    --hair: rgba(255,255,255,0.10);
    --ground: #060608;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; height:100%; background:var(--ground); overflow:hidden; }
  canvas{ position:fixed; inset:0; width:100%; height:100%; display:block; }

  .mono{ font-family:"Space Mono", ui-monospace, monospace; }

  #colophon{
    position:fixed; left:26px; bottom:24px; z-index:5; pointer-events:none;

  #colophon h1{
    font-family:"Cormorant Garamond", Georgia, serif;

    -webkit-backdrop-filter:blur(16px) saturate(0.9);
    font-family:"Space Mono", monospace;
    transition:opacity .35s ease, transform .35s ease;
  }
  #panel.hidden{ opacity:0; transform:translateX(-14px); pointer-events:none; }
  #panel::-webkit-scrollbar{ width:3px; }
  #panel::-webkit-scrollbar-thumb{ background:var(--ink-faint); }

  .sect{
    font-size:8px; letter-spacing:0.24em; color:var(--ink-dim);
    text-transform:uppercase; margin:20px 0 10px;
    padding-bottom:5px; border-bottom:1px solid var(--hair);

  .sect:first-child{ margin-top:2px; }

  .row{ margin:0 0 10px; }

  .row .val{ font-size:9px; color:var(--ink-dim); font-variant-numeric:tabular-nums; }

  input[type=range]{

<body>
<canvas id="c"></canvas>

  <p>Nothing here is drawn. Two fields run unrendered; the figure is only their difference.</p>
</div>

<div id="panel">
  <div class="sect">Plate</div>
  <div class="row">
    <div class="head"><label for="seed">Seed</label></div>
    <input type="text" id="seed" spellcheck="false" autocomplete="off">

    </div>
  </div>

<div id="keys" class="mono">
  n new plate<br>r reveal sources<br>p pause<br>h hide panel<br>s save
</div>

<script>
(function(){
"use strict";

var canvas = document.getElementById('c');
var gl = canvas.getContext('webgl2', { antialias:false, alpha:false, preserveDrawingBuffer:true });
if(!gl){
  document.getElementById('fallback').style.display = 'grid';
  document.getElementById('panel').style.display = 'none';
  return;
}

/* ---------------------------------------------------------------- shaders */

var VERT = `#version 300 es
void main(){
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

var FRAG = `#version 300 es
precision highp float;
out vec4 fragColor;

uniform vec2  uRes;
uniform float uTime;
uniform float uPhase;
uniform float uSeed;
uniform float uZoom;

uniform int   uTypeA;
uniform int   uTypeB;
uniform float uFreqA;
uniform float uFreqB;
uniform float uRotA;
uniform float uRotB;
uniform vec2  uCenB;
uniform float uArms;
uniform float uBeta;

uniform float uBands;
uniform float uWidth;
uniform float uHalo;
uniform float uWarp;
uniform float uWarpScale;
uniform float uDisp;

uniform int   uPalette;
uniform float uHueStep;
uniform float uHueShift;
uniform float uExposure;

uniform float uGrain;
uniform float uVig;
uniform float uReveal;

float hash21(vec2 p){
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y) * 2.0 - 1.0;
}

float fbm(vec2 p){
  float s = 0.0, a = 0.5;
  for(int i = 0; i < 5; i++){
    s += a * vnoise(p);
    p = p * 2.03 + 17.13;
    a *= 0.5;
  }
  return s;
}

vec2 rot(vec2 p, float a){
  float c = cos(a), s = sin(a);
  return vec2(c * p.x - s * p.y, s * p.x + c * p.y);
}

float field(int type, vec2 p, float freq, float a, vec2 cen, float m){
  vec2 q = rot(p - cen, a);
  float r = length(q) + 1e-5;
  float th = atan(q.y, q.x);
  if(type == 0) return q.x * freq;
  if(type == 1) return r * freq;
  if(type == 2) return r * freq + m * th;
  if(type == 3) return q.x * q.y * freq * 2.2;
  if(type == 4){
    float s = 0.0;
    for(int i = 0; i < 5; i++){
      float ang = 3.14159265 * float(i) / 5.0;
      s += cos(freq * dot(q, vec2(cos(ang), sin(ang))));
    }
    return s * freq * 0.18;
  }
  if(type == 5) return log(r + 0.05) * freq * 0.75 + m * th;
  return fbm(q * 2.0) * freq * 1.25;
}

float contour(float f, float w, float halo, out float index){
  float aa = fwidth(f) + 1e-6;
  float d = abs(f - floor(f) - 0.5);
  float core = 1.0 - smoothstep(0.0, w * aa, d);
  float glow = 1.0 - smoothstep(0.0, w * aa * 7.0, d);
  float v = core + glow * halo;
  v *= 1.0 / (1.0 + aa * w * 1.5);
  v *= 1.0 - smoothstep(1.2, 5.0, aa * w);
  index = floor(f);
  return v;
}

vec3 pal(float t, int k){
  vec3 a, b, c, d;
  if(k == 0){      a = vec3(0.50);                b = vec3(0.50);                c = vec3(1.00);                d = vec3(0.00, 0.33, 0.67); }
  else if(k == 1){ a = vec3(0.30, 0.50, 0.50);    b = vec3(0.35, 0.40, 0.40);    c = vec3(1.00, 1.00, 0.60);    d = vec3(0.00, 0.15, 0.35); }
  else if(k == 2){ a = vec3(0.55, 0.35, 0.22);    b = vec3(0.45, 0.30, 0.20);    c = vec3(1.00, 0.90, 0.70);    d = vec3(0.00, 0.08, 0.16); }
  else if(k == 3){ a = vec3(0.45, 0.55, 0.65);    b = vec3(0.30, 0.30, 0.35);    c = vec3(1.00, 1.00, 1.00);    d = vec3(0.55, 0.62, 0.72); }
  else if(k == 4){ a = vec3(0.74, 0.70, 0.62);    b = vec3(0.16, 0.18, 0.22);    c = vec3(1.00, 1.00, 1.00);    d = vec3(0.00, 0.10, 0.20); }
  else {           a = vec3(0.45, 0.35, 0.60);    b = vec3(0.35, 0.28, 0.45);    c = vec3(1.00, 1.00, 1.00);    d = vec3(0.10, 0.25, 0.50); }
  return a + b * cos(6.28318 * (c * t + d));
}

void main(){
  vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / min(uRes.x, uRes.y) * 2.0 * uZoom;

  if(uWarp > 0.0001){
    vec2 w = vec2(fbm(p * uWarpScale + uSeed), fbm(p * uWarpScale + uSeed + 31.7));
    p += uWarp * w;
  }

  float A = field(uTypeA, p, uFreqA, uRotA, vec2(0.0), uArms);
  float B = field(uTypeB, p, uFreqB, uRotB + uPhase * 0.004, uCenB, uArms);

  float D = (A - uBeta * B) * uBands + uPhase * 0.35;

  float ir, ig, ib;
  float Ir = contour(D * (1.0 + uDisp), uWidth, uHalo, ir);
  float Ig = contour(D,                 uWidth, uHalo, ig);
  float Ib = contour(D * (1.0 - uDisp), uWidth, uHalo, ib);

  float t = fract(ig * uHueStep + uHueShift);
  vec3 base = pal(t, uPalette);

  vec3 col = base * vec3(Ir, Ig, Ib);
  col += vec3(pow(clamp(Ig, 0.0, 1.0), 5.0)) * 0.30;

  if(uReveal > 0.001){
    float ja, jb;
    float va = contour(A * 0.5, uWidth, 0.0, ja);
    float vb = contour(uBeta * B * 0.5, uWidth, 0.0, jb);
    col += uReveal * 0.26 * (va * vec3(0.32, 0.52, 0.92) + vb * vec3(0.95, 0.48, 0.28));
  }

  col += vec3(0.016, 0.017, 0.022);
  col = vec3(1.0) - exp(-col * uExposure);

  vec2 uv = gl_FragCoord.xy / uRes;
  float rad = length(uv - 0.5) * 1.414;
  col *= 1.0 - uVig * smoothstep(0.32, 1.02, rad);

  float g = hash21(gl_FragCoord.xy + fract(uSeed) * 133.0 + floor(uTime * 24.0) * 0.017) - 0.5;
  col += g * uGrain;

  fragColor = vec4(max(col, 0.0), 1.0);
}`;

function compile(src, type){
  var s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    console.error(gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}

var prog = gl.createProgram();
gl.attachShader(prog, compile(VERT, gl.VERTEX_SHADER));
gl.attachShader(prog, compile(FRAG, gl.FRAGMENT_SHADER));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){
  console.error(gl.getProgramInfoLog(prog));
}
gl.useProgram(prog);
var vao = gl.createVertexArray();
gl.bindVertexArray(vao);

var U = {};
function u(name){
  if(!(name in U)) U[name] = gl.getUniformLocation(prog, name);
  return U[name];
}

/* ----------------------------------------------------------------- state */

var TYPES = ['plane', 'radial', 'spiral', 'hyperbolic', 'quasiperiodic', 'logarithmic', 'turbulent'];
var PALETTES = ['spectral', 'aurora', 'ember', 'ice', 'bone', 'violet'];

var P = {
  seed: 'AURUM',
  typeA: 1, typeB: 1,
  freqA: 18, rotA: 0.0,
  detune: 1.006, rotB: 0.02, offX: 0.14, offY: -0.06,
  arms: 3, beta: 1.0,
  density: 1.0, width: 1.2, halo: 0.18,
  warp: 0.0, warpScale: 1.6, disp: 0.010,
  palette: 0, hueStep: 0.040, hueShift: 0.10, exposure: 1.6,
  zoom: 1.0, drift: 0.22, grain: 0.055, vignette: 0.55, reveal: 0.0
};

function hashStr(str){
  var h = 2166136261 >>> 0;
  for(var i = 0; i < str.length; i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h >>> 0;
}

function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function coinSeed(){
  var alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var s = '';
  for(var i = 0; i < 6; i++) s += alphabet[(Math.random() * alphabet.length) | 0];
  return s;
}

var TYPE_WEIGHTS = [0.10, 0.22, 0.16, 0.12, 0.14, 0.16, 0.10];

function pickType(r){
  var x = r(), acc = 0;
  for(var i = 0; i < TYPE_WEIGHTS.length; i++){
    acc += TYPE_WEIGHTS[i];
    if(x < acc) return i;
  }
  return TYPE_WEIGHTS.length - 1;
}

function span(r, lo, hi){ return lo + r() * (hi - lo); }

function newPlate(seedStr){
  P.seed = (seedStr || coinSeed()).toUpperCase();
  var r = mulberry32(hashStr(P.seed));

  P.typeA = pickType(r);
  P.freqA = span(r, 7, 26);
  P.rotA  = span(r, -Math.PI, Math.PI);
  P.arms  = Math.floor(span(r, 1, 8));

  var kin = r() < 0.62;
  P.typeB = kin ? P.typeA : pickType(r);

  if(P.typeB === P.typeA){
    P.detune = 1 + span(r, -0.022, 0.022);
    P.rotB   = span(r, -0.055, 0.055);
    P.offX   = span(r, -0.30, 0.30);
    P.offY   = span(r, -0.30, 0.30);
  } else {
    P.detune = span(r, 0.82, 1.20);
    P.rotB   = span(r, -0.85, 0.85);
    P.offX   = span(r, -0.18, 0.18);
    P.offY   = span(r, -0.18, 0.18);
  }

  P.beta      = span(r, 0.94, 1.06);
  P.density   = span(r, 0.55, 1.7);
  P.width     = span(r, 0.8, 2.0);
  P.halo      = span(r, 0.08, 0.32);
  P.warp      = r() < 0.42 ? span(r, 0.04, 0.26) : 0.0;
  P.warpScale = span(r, 0.6, 3.2);
  P.disp      = span(r, 0.002, 0.022);
  P.palette   = Math.floor(r() * PALETTES.length);
  P.hueStep   = span(r, 0.008, 0.085);
  P.hueShift  = r();
}

/* ------------------------------------------- band scale (legibility pass) */

function jhash21(x, y){
  var px = (x * 123.34) % 1, py = (y * 456.21) % 1;
  if(px < 0) px += 1;
  if(py < 0) py += 1;
  var d = px * px + py * py + px * 45.32 + py * 45.32;
  px = (px + d) % 1; py = (py + d) % 1;
  var v = (px * py) % 1;
  return v < 0 ? v + 1 : v;
}

function jvnoise(x, y){
  var ix = Math.floor(x), iy = Math.floor(y);
  var fx = x - ix, fy = y - iy;
  var a = jhash21(ix, iy), b = jhash21(ix + 1, iy), c = jhash21(ix, iy + 1), d = jhash21(ix + 1, iy + 1);
  var ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  var m = (a + (b - a) * ux) + ((c + (d - c) * ux) - (a + (b - a) * ux)) * uy;
  return m * 2 - 1;
}

function jfbm(x, y){
  var s = 0, amp = 0.5;
  for(var i = 0; i < 5; i++){
    s += amp * jvnoise(x, y);
    x = x * 2.03 + 17.13; y = y * 2.03 + 17.13;
    amp *= 0.5;
  }
  return s;
}

function jfield(type, x, y, freq, a, cx, cy, m){
  var dx = x - cx, dy = y - cy;
  var c = Math.cos(a), s = Math.sin(a);
  var qx = c * dx - s * dy, qy = s * dx + c * dy;
  var r = Math.sqrt(qx * qx + qy * qy) + 1e-5;
  var th = Math.atan2(qy, qx);
  if(type === 0) return qx * freq;
  if(type === 1) return r * freq;
  if(type === 2) return r * freq + m * th;
  if(type === 3) return qx * qy * freq * 2.2;
  if(type === 4){
    var acc = 0;
    for(var i = 0; i < 5; i++){
      var ang = Math.PI * i / 5;
      acc += Math.cos(freq * (qx * Math.cos(ang) + qy * Math.sin(ang)));
    }
    return acc * freq * 0.18;
  }
  if(type === 5) return Math.log(r + 0.05) * freq * 0.75 + m * th;
  return jfbm(qx * 2.0, qy * 2.0) * freq * 1.25;
}

/* The two fields can differ by a whisper or by an order of magnitude, so the
   contour scale is derived from the measured range of the difference rather
   than fixed. This keeps every seed legible. */
function bandScale(){
  var N = 40, vals = [];
  var freqB = P.freqA * P.detune;
  for(var i = 0; i <= N; i++){
    for(var j = 0; j <= N; j++){
      var x = (i / N * 2 - 1) * P.zoom;
      var y = (j / N * 2 - 1) * P.zoom;
      var A = jfield(P.typeA, x, y, P.freqA, P.rotA, 0, 0, P.arms);
      var B = jfield(P.typeB, x, y, freqB, P.rotA + P.rotB, P.offX, P.offY, P.arms);
      vals.push(A - P.beta * B);
    }
  }
  vals.sort(function(a, b){ return a - b; });
  var lo = vals[Math.floor((vals.length - 1) * 0.02)];
  var hi = vals[Math.floor((vals.length - 1) * 0.98)];
  var range = Math.max(hi - lo, 1e-4);
  return (38 * P.density) / range;
}

/* ------------------------------------------------------------------- draw */

var dpr = 1, bands = 1, time = 0, phase = 0, paused = false, last = performance.now();

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = Math.max(2, Math.floor(window.innerWidth  * dpr));
  canvas.height = Math.max(2, Math.floor(window.innerHeight * dpr));
}

function render(){
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(prog);
  gl.bindVertexArray(vao);

  gl.uniform2f(u('uRes'), canvas.width, canvas.height);
  gl.uniform1f(u('uTime'), time);
  gl.uniform1f(u('uPhase'), phase);
  gl.uniform1f(u('uSeed'), (hashStr(P.seed) % 10000) / 97.0);
  gl.uniform1f(u('uZoom'), P.zoom);

  gl.uniform1i(u('uTypeA'), P.typeA);
  gl.uniform1i(u('uTypeB'), P.typeB);
  gl.uniform1f(u('uFreqA'), P.freqA);
  gl.uniform1f(u('uFreqB'), P.freqA * P.detune);
  gl.uniform1f(u('uRotA'), P.rotA);
  gl.uniform1f(u('uRotB'), P.rotA + P.rotB);
  gl.uniform2f(u('uCenB'), P.offX, P.offY);
  gl.uniform1f(u('uArms'), P.arms);
  gl.uniform1f(u('uBeta'), P.beta);

  gl.uniform1f(u('uBands'), bands);
  gl.uniform1f(u('uWidth'), P.width);
  gl.uniform1f(u('uHalo'), P.halo);
  gl.uniform1f(u('uWarp'), P.warp);
  gl.uniform1f(u('uWarpScale'), P.warpScale);
  gl.uniform1f(u('uDisp'), P.disp);

  gl.uniform1i(u('uPalette'), P.palette);
  gl.uniform1f(u('uHueStep'), P.hueStep);
  gl.uniform1f(u('uHueShift'), P.hueShift);
  gl.uniform1f(u('uExposure'), P.exposure);

  gl.uniform1f(u('uGrain'), P.grain);
  gl.uniform1f(u('uVig'), P.vignette);
  gl.uniform1f(u('uReveal'), P.reveal);

  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function frame(now){
  var dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if(!paused){
    time += dt;
    phase += dt * P.drift;
  }
  render();
  requestAnimationFrame(frame);
}

/* ----------------------------------------------------------------- panel */

var SPEC = [
  { s: 'Field A, unseen' },
  { k: 'typeA',     l: 'Form',        opts: TYPES },
  { k: 'freqA',     l: 'Frequency',   min: 3,    max: 40,   step: 0.1,    d: 1 },
  { k: 'rotA',      l: 'Rotation',    min: -3.15, max: 3.15, step: 0.005, d: 3 },
  { k: 'arms',      l: 'Arms',        min: 0,    max: 8,    step: 1,      d: 0 },

  { s: 'Field B, unseen' },
  { k: 'typeB',     l: 'Form',        opts: TYPES },
  { k: 'detune',    l: 'Detune',      min: 0.80, max: 1.20, step: 0.0002, d: 4 },
  { k: 'rotB',      l: 'Rotation off', min: -1.0, max: 1.0, step: 0.001,  d: 3 },
  { k: 'offX',      l: 'Offset x',    min: -0.6, max: 0.6,  step: 0.002,  d: 3 },
  { k: 'offY',      l: 'Offset y',    min: -0.6, max: 0.6,  step: 0.002,  d: 3 },
  { k: 'beta',      l: 'Weight',      min: 0.7,  max: 1.3,  step: 0.001,  d: 3 },

  { s: 'Interference' },
  { k: 'density',   l: 'Fringes',     min: 0.1,  max: 4.0,  step: 0.01,   d: 2 },
  { k: 'width',     l: 'Line',        min: 0.4,  max: 3.5,  step: 0.01,   d: 2 },
  { k: 'halo',      l: 'Halo',        min: 0,    max: 0.7,  step: 0.005,  d: 3 },
  { k: 'warp',      l: 'Warp',        min: 0,    max: 0.6,  step: 0.002,  d: 3 },
  { k: 'warpScale', l: 'Warp scale',  min: 0.3,  max: 4.0,  step: 0.01,   d: 2 },
  { k: 'disp',      l: 'Dispersion',  min: 0,    max: 0.06, step: 0.0005, d: 4 },

  { s: 'Light' },
  { k: 'palette',   l: 'Palette',     opts: PALETTES },
  { k: 'hueStep',   l: 'Hue per fringe', min: 0, max: 0.15, step: 0.0005, d: 4 },
  { k: 'hueShift',  l: 'Hue origin',  min: 0,    max: 1,    step: 0.002,  d: 3 },
  { k: 'exposure',  l: 'Exposure',    min: 0.4,  max: 3.2,  step: 0.01,   d: 2 },

  { s: 'Plate' },
  { k: 'zoom',      l: 'Field of view', min: 0.25, max: 3.5, step: 0.005, d: 3 },
  { k: 'drift',     l: 'Drift',       min: 0,    max: 1.5,  step: 0.005,  d: 3 },
  { k: 'grain',     l: 'Grain',       min: 0,    max: 0.18, step: 0.001,  d: 3 },
  { k: 'vignette',  l: 'Vignette',    min: 0,    max: 1,    step: 0.005,  d: 3 },
  { k: 'reveal',    l: 'Reveal sources', min: 0, max: 1,    step: 0.01,   d: 2 }
];

var GEOMETRIC = { typeA:1, typeB:1, freqA:1, rotA:1, arms:1, detune:1, rotB:1, offX:1, offY:1, beta:1, density:1, zoom:1 };
var widgets = {};

function buildPanel(){
  var host = document.getElementById('controls');
  host.innerHTML = '';
  SPEC.forEach(function(item){
    if(item.s){
      var h = document.createElement('div');
      h.className = 'sect';
      h.textContent = item.s;
      host.appendChild(h);
      return;
    }
    var row = document.createElement('div');
    row.className = 'row';
    var head = document.createElement('div');
    head.className = 'head';
    var lab = document.createElement('label');
    lab.textContent = item.l;
    lab.htmlFor = 'ctl_' + item.k;
    head.appendChild(lab);

    if(item.opts){
      row.appendChild(head);
      var sel = document.createElement('select');
      sel.id = 'ctl_' + item.k;
      item.opts.forEach(function(name, i){
        var o = document.createElement('option');
        o.value = String(i);
        o.textContent = name;
        sel.appendChild(o);
      });
      sel.addEventListener('input', function(){
        P[item.k] = parseInt(sel.value, 10);
        if(GEOMETRIC[item.k]) bands = bandScale();
      });
      row.appendChild(sel);
      widgets[item.k] = { el: sel, kind: 'select' };
    } else {
      var val = document.createElement('div');
      val.className = 'val';
      head.appendChild(val);
      row.appendChild(head);
      var rng = document.createElement('input');
      rng.type = 'range';
      rng.id = 'ctl_' + item.k;
      rng.min = item.min; rng.max = item.max; rng.step = item.step;
      rng.addEventListener('input', function(){
        P[item.k] = parseFloat(rng.value);
        val.textContent = P[item.k].toFixed(item.d);
        if(GEOMETRIC[item.k]) bands = bandScale();
      });
      row.appendChild(rng);
      widgets[item.k] = { el: rng, kind: 'range', val: val, d: item.d };
    }
    host.appendChild(row);
  });
}

function syncPanel(){
  Object.keys(widgets).forEach(function(k){
    var w = widgets[k];
    if(w.kind === 'select'){
      w.el.value = String(P[k]);
    } else {
      w.el.value = P[k];
      w.val.textContent = Number(P[k]).toFixed(w.d);
    }
  });
  document.getElementById('seed').value = P.seed;
}

/* ------------------------------------------------------------------- io */

function commitPlate(seedStr){
  newPlate(seedStr);
  bands = bandScale();
  syncPanel();
  try{ history.replaceState(null, '', '#' + P.seed); }catch(e){}
}

function savePNG(){
  var w = canvas.width, h = canvas.height;
  var scale = 2;
  canvas.width  = Math.min(Math.floor(w * scale), 4096);
  canvas.height = Math.min(Math.floor(h * scale), 4096);
  render();
  canvas.toBlob(function(blob){
    if(blob){
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'interferentia_' + P.seed + '.png';
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    }
    canvas.width = w; canvas.height = h;
    render();
  }, 'image/png');
}

document.getElementById('btnNew').addEventListener('click', function(){ commitPlate(null); });
document.getElementById('btnSave').addEventListener('click', savePNG);
document.getElementById('seed').addEventListener('change', function(e){
  var v = e.target.value.trim();
  if(v) commitPlate(v);
});

window.addEventListener('keydown', function(e){
  if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
  var k = e.key.toLowerCase();
  if(k === 'n'){ commitPlate(null); }
  else if(k === 's'){ savePNG(); }
  else if(k === 'p'){ paused = !paused; }
  else if(k === 'h'){ document.getElementById('panel').classList.toggle('hidden'); }
  else if(k === 'r'){
    P.reveal = P.reveal > 0.01 ? 0 : 0.85;
    syncPanel();
  }
});

window.addEventListener('resize', function(){ resize(); });

resize();
buildPanel();
commitPlate((location.hash || '').replace('#', '') || null);
requestAnimationFrame(frame);

})();
</script>
