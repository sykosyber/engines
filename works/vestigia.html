<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vestigia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: rgba(255,255,255,0.62);
    --ink-dim: rgba(255,255,255,0.30);
    --ink-faint: rgba(255,255,255,0.14);
    --hair: rgba(255,255,255,0.10);
    --ground: #060608;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; height:100%; background:var(--ground); overflow:hidden; }
  canvas#c{ position:fixed; inset:0; width:100%; height:100%; display:block; }

  .mono{ font-family:"Space Mono", ui-monospace, monospace; }

  #colophon{
    position:fixed; left:26px; bottom:24px; z-index:5; pointer-events:none;
    mix-blend-mode:screen;
  }
  #colophon h1{
    font-family:"Cormorant Garamond", Georgia, serif;
    font-style:italic; font-weight:300; font-size:38px; line-height:1;
    margin:0 0 9px 0; letter-spacing:0.045em;
    color:rgba(255,255,255,0.74);
  }
  #colophon p{
    font-family:"Space Mono", monospace; font-size:8.5px; line-height:1.7;
    margin:0; letter-spacing:0.20em; color:var(--ink-dim); text-transform:uppercase;
    max-width:48ch;
  }

  #panel{
    position:fixed; left:26px; top:26px; z-index:6; width:272px;
    max-height:calc(100vh - 200px); overflow-y:auto;
    padding:16px 16px 20px;
    background:rgba(5,5,8,0.62);
    border:1px solid var(--hair);
    backdrop-filter:blur(16px) saturate(0.9);
    -webkit-backdrop-filter:blur(16px) saturate(0.9);
    font-family:"Space Mono", monospace;
    transition:opacity .35s ease, transform .35s ease;
  }
  #panel.hidden{ opacity:0; transform:translateX(-14px); pointer-events:none; }
  #panel::-webkit-scrollbar{ width:3px; }
  #panel::-webkit-scrollbar-thumb{ background:var(--ink-faint); }

  .sect{
    font-size:8px; letter-spacing:0.24em; color:var(--ink-dim);
    text-transform:uppercase; margin:20px 0 10px;
    padding-bottom:5px; border-bottom:1px solid var(--hair);
  }
  .sect:first-child{ margin-top:2px; }

  .row{ margin:0 0 10px; }
  .row .head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; }
  .row label{ font-size:9px; letter-spacing:0.08em; color:var(--ink); }
  .row .val{ font-size:9px; color:var(--ink-dim); font-variant-numeric:tabular-nums; }

  input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:11px;
    background:transparent; cursor:ew-resize; margin:0;
  }
  input[type=range]::-webkit-slider-runnable-track{ height:1px; background:var(--ink-faint); }
  input[type=range]::-moz-range-track{ height:1px; background:var(--ink-faint); }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:8px; height:8px; border-radius:50%;
    background:rgba(255,255,255,0.85); margin-top:-3.5px;
  }
  input[type=range]::-moz-range-thumb{
    width:8px; height:8px; border:0; border-radius:50%; background:rgba(255,255,255,0.85);
  }
  input[type=range]:focus-visible{ outline:1px solid rgba(255,255,255,0.5); outline-offset:3px; }

  select, input[type=text]{
    width:100%; background:rgba(255,255,255,0.03); color:var(--ink);
    border:1px solid var(--hair); border-radius:0;
    font-family:"Space Mono", monospace; font-size:9.5px; letter-spacing:0.06em;
    padding:5px 6px; outline:none;
  }
  select:focus-visible, input[type=text]:focus-visible{ border-color:rgba(255,255,255,0.45); }
  select option{ background:#0a0a0d; }

  .btns{ display:flex; gap:6px; margin-top:8px; }
  button{
    flex:1; background:transparent; color:var(--ink);
    border:1px solid var(--hair); border-radius:0;
    font-family:"Space Mono", monospace; font-size:8.5px; letter-spacing:0.16em;
    text-transform:uppercase; padding:7px 4px; cursor:pointer;
    transition:background .2s ease, color .2s ease;
  }
  button:hover{ background:rgba(255,255,255,0.07); color:rgba(255,255,255,0.9); }
  button:focus-visible{ outline:1px solid rgba(255,255,255,0.5); outline-offset:2px; }

  #status{
    margin-top:10px; font-size:8px; letter-spacing:0.16em; color:var(--ink-faint);
    text-transform:uppercase; line-height:1.8;
  }

  #keys{
    position:fixed; right:26px; bottom:24px; z-index:5;
    font-family:"Space Mono", monospace; font-size:8px; letter-spacing:0.18em;
    color:var(--ink-faint); text-align:right; line-height:2; text-transform:uppercase;
    pointer-events:none;
  }
  @media (max-width: 760px){
    #panel{ width:calc(100vw - 40px); left:20px; top:20px; max-height:52vh; }
    #colophon{ left:20px; bottom:18px; }
    #colophon h1{ font-size:28px; }
    #keys{ display:none; }
  }
  @media (prefers-reduced-motion: reduce){
    #panel{ transition:none; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="panel">
  <div class="sect">Plate</div>
  <div class="row">
    <div class="head"><label for="seed">Seed</label></div>
    <input type="text" id="seed" spellcheck="false" autocomplete="off">
    <div class="btns">
      <button id="btnNew">New plate</button>
      <button id="btnSave">Save png</button>
    </div>
    <div id="status">idle</div>
  </div>
  <div id="controls"></div>
</div>

<div id="colophon">
  <h1>Vestigia</h1>
  <p>Every direction the growth considered stays on the plate. The bright filament is the part that survived.</p>
</div>

<div id="keys" class="mono">
  n new plate<br>r residue on or off<br>h hide panel<br>s save
</div>

<script>
(function(){
"use strict";

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

var ghost = document.createElement('canvas');
var gctx = ghost.getContext('2d');
var tree = document.createElement('canvas');
var tctx = tree.getContext('2d');

/* ------------------------------------------------------------------ seed */

function hashStr(str){
  var h = 2166136261 >>> 0;
  for(var i = 0; i < str.length; i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function coinSeed(){
  var alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s = '';
  for(var i = 0; i < 6; i++) s += alphabet[(Math.random() * alphabet.length) | 0];
  return s;
}

/* ----------------------------------------------------------------- state */

var SHAPES = ['disc', 'ellipse', 'teardrop', 'annulus', 'lobed', 'band'];
var ROOTS  = ['base', 'centre', 'edge'];
var PALETTES = ['spectral', 'aurora', 'ember', 'ice', 'bone', 'violet'];

var P = {
  seed: 'VESTIGIA',
  shape: 0, roots: 0,
  count: 1800, radius: 0.82, aspect: 1.0, lobes: 5,
  influence: 0.13, kill: 0.030, step: 0.0125, jitter: 0.12, tropism: 0.22,
  considered: 0.85, conAlpha: 0.055, fieldAlpha: 0.022,
  threshold: 7.0, thickness: 1.0, taper: 2.4,
  ghostAlpha: 0.16, bloom: 0.35,
  palette: 0, hueSpan: 0.55, hueShift: 0.05,
  zoom: 1.0, grain: 0.055, vignette: 0.55, residue: 1.0
};

var SIM_KEYS = { shape:1, roots:1, count:1, radius:1, aspect:1, lobes:1,
                 influence:1, kill:1, step:1, jitter:1, tropism:1, considered:1 };

function span(r, lo, hi){ return lo + r() * (hi - lo); }

function newPlate(seedStr){
  P.seed = (seedStr || coinSeed()).toUpperCase();
  var r = mulberry32(hashStr(P.seed));

  P.shape  = Math.floor(r() * SHAPES.length);
  P.roots  = r() < 0.55 ? 0 : (r() < 0.6 ? 1 : 2);
  P.count  = Math.floor(span(r, 900, 3000));
  P.radius = span(r, 0.66, 0.94);
  P.aspect = span(r, 0.62, 1.45);
  P.lobes  = Math.floor(span(r, 3, 8));

  P.influence = span(r, 0.085, 0.20);
  P.kill      = span(r, 0.018, 0.042);
  P.step      = span(r, 0.008, 0.017);
  P.jitter    = span(r, 0.02, 0.30);
  P.tropism   = P.roots === 1 ? 0 : span(r, 0.05, 0.42);

  P.threshold = span(r, 4, 13);
  P.thickness = span(r, 0.7, 1.5);
  P.conAlpha  = span(r, 0.030, 0.090);
  P.fieldAlpha = span(r, 0.008, 0.034);
  P.ghostAlpha = span(r, 0.10, 0.26);
  P.palette   = Math.floor(r() * PALETTES.length);
  P.hueSpan   = span(r, 0.18, 0.8);
  P.hueShift  = r();
  P.bloom     = span(r, 0.18, 0.55);
}

/* --------------------------------------------------------------- palette */

var PAL = [
  [[0.50,0.50,0.50],[0.50,0.50,0.50],[1.00,1.00,1.00],[0.00,0.33,0.67]],
  [[0.30,0.50,0.50],[0.35,0.40,0.40],[1.00,1.00,0.60],[0.00,0.15,0.35]],
  [[0.55,0.35,0.22],[0.45,0.30,0.20],[1.00,0.90,0.70],[0.00,0.08,0.16]],
  [[0.45,0.55,0.65],[0.30,0.30,0.35],[1.00,1.00,1.00],[0.55,0.62,0.72]],
  [[0.74,0.70,0.62],[0.16,0.18,0.22],[1.00,1.00,1.00],[0.00,0.10,0.20]],
  [[0.45,0.35,0.60],[0.35,0.28,0.45],[1.00,1.00,1.00],[0.10,0.25,0.50]]
];
function pal(t, k){
  var q = PAL[k], o = [];
  for(var i = 0; i < 3; i++){
    o.push(Math.max(0, Math.min(1, q[0][i] + q[1][i] * Math.cos(6.28318 * (q[2][i] * t + q[3][i])))));
  }
  return o;
}

/* ------------------------------------------------------------- the cloud */

function radiusAt(th){
  var R = P.radius;
  switch(P.shape){
    case 0: return R;
    case 1: {
      var ax = R * P.aspect, ay = R;
      var c = Math.cos(th), s = Math.sin(th);
      return (ax * ay) / Math.sqrt(ay * ay * c * c + ax * ax * s * s);
    }
    case 2: return R * 1.25 * Math.pow(Math.abs(Math.sin(0.5 * (th + Math.PI / 2))), 0.62);
    case 3: return R;
    case 4: return R * (1 + 0.26 * Math.cos(P.lobes * th));
    default: return R;
  }
}

function sampleCloud(r){
  var pts = new Float32Array(P.count * 2);
  var cy = (P.roots === 0) ? 0.10 : 0.0;
  for(var i = 0; i < P.count; i++){
    var x, y;
    if(P.shape === 5){
      x = (r() * 2 - 1) * P.radius * 1.25;
      y = (r() * 2 - 1) * P.radius * 0.42 * P.aspect;
    } else {
      var th = r() * Math.PI * 2;
      var rr = radiusAt(th);
      var u = r();
      var rad = (P.shape === 3) ? rr * (0.46 + 0.54 * Math.sqrt(u)) : rr * Math.sqrt(u);
      x = Math.cos(th) * rad;
      y = Math.sin(th) * rad;
    }
    pts[i * 2] = x;
    pts[i * 2 + 1] = y + cy;
  }
  return pts;
}

/* --------------------------------------------------- space colonisation */

var sim = null;

function makeSim(){
  var r = mulberry32(hashStr(P.seed) ^ 0x9E3779B9);
  var att = sampleCloud(r);
  var alive = new Uint8Array(P.count);
  alive.fill(1);

  var cap = 60000;
  var nx = new Float32Array(cap), ny = new Float32Array(cap);
  var par = new Int32Array(cap), dep = new Int32Array(cap);
  var n = 0;

  var lowest = 1e9, cx = 0, cyc = 0;
  for(var i = 0; i < P.count; i++){ cx += att[i*2]; cyc += att[i*2+1]; if(att[i*2+1] < lowest) lowest = att[i*2+1]; }
  cx /= P.count; cyc /= P.count;

  function addNode(x, y, p, d){
    if(n >= cap) return -1;
    nx[n] = x; ny[n] = y; par[n] = p; dep[n] = d;
    gridInsert(n);
    return n++;
  }

  var cell = Math.max(P.influence, 1e-3);
  var grid = new Map();
  function key(ix, iy){ return ix * 73856093 ^ iy * 19349663; }
  function gridInsert(i){
    var ix = Math.floor(nx[i] / cell), iy = Math.floor(ny[i] / cell);
    var k = key(ix, iy);
    var b = grid.get(k);
    if(!b){ b = []; grid.set(k, b); }
    b.push(i);
  }

  if(P.roots === 0){
    addNode(0, lowest - 0.10, -1, 0);
  } else if(P.roots === 1){
    addNode(cx, cyc, -1, 0);
  } else {
    var m = 3 + Math.floor(r() * 3);
    for(var j = 0; j < m; j++){
      var a = Math.PI * (1.15 + 0.7 * (j / Math.max(1, m - 1)));
      addNode(Math.cos(a) * (P.radius + 0.06), Math.sin(a) * (P.radius + 0.06) + 0.05, -1, 0);
    }
  }

  var accX = new Float32Array(cap), accY = new Float32Array(cap), accN = new Int32Array(cap);

  var linkBatches = [], fieldBatches = [], storedLinks = 0;
  var LINK_CAP = 240000;
  var iter = 0;

  function nearest(ax, ay){
    var ix = Math.floor(ax / cell), iy = Math.floor(ay / cell);
    var best = -1, bd = P.influence * P.influence;
    for(var dx = -1; dx <= 1; dx++){
      for(var dy = -1; dy <= 1; dy++){
        var b = grid.get(key(ix + dx, iy + dy));
        if(!b) continue;
        for(var t = 0; t < b.length; t++){
          var i = b[t];
          var ddx = nx[i] - ax, ddy = ny[i] - ay;
          var d2 = ddx * ddx + ddy * ddy;
          if(d2 < bd){ bd = d2; best = i; }
        }
      }
    }
    return best;
  }

  function stepOnce(){
    iter++;
    var i, live = 0;
    accX.fill(0, 0, n); accY.fill(0, 0, n); accN.fill(0, 0, n);

    var links = [], stamps = [];
    var kill2 = P.kill * P.kill;

    for(i = 0; i < P.count; i++){
      if(!alive[i]) continue;
      live++;
      var ax = att[i*2], ay = att[i*2+1];
      var j = nearest(ax, ay);
      if(j < 0) continue;
      var dx = ax - nx[j], dy = ay - ny[j];
      var d2 = dx * dx + dy * dy;
      if(d2 < kill2){ alive[i] = 0; continue; }
      var d = Math.sqrt(d2);
      accX[j] += dx / d; accY[j] += dy / d; accN[j]++;
      if(storedLinks < LINK_CAP && r() < P.considered){
        links.push(ax, ay, nx[j], ny[j]);
        storedLinks++;
      }
      if((iter & 3) === 0 && r() < 0.4) stamps.push(ax, ay);
    }

    var grown = 0, base = n;
    for(i = 0; i < base; i++){
      if(accN[i] === 0) continue;
      var vx = accX[i] / accN[i], vy = accY[i] / accN[i];
      if(P.roots === 0) vy += P.tropism;
      else if(P.roots === 2) vy += P.tropism * 0.6;
      vx += (r() * 2 - 1) * P.jitter;
      vy += (r() * 2 - 1) * P.jitter;
      var L = Math.hypot(vx, vy);
      if(L < 1e-6) continue;
      addNode(nx[i] + vx / L * P.step, ny[i] + vy / L * P.step, i, dep[i] + 1);
      grown++;
    }

    /* nothing in reach: extend the nearest tip toward the cloud so the
       trunk can cross the gap, as in the original venation model */
    if(grown === 0 && live > 0 && n < cap){
      var bi = -1, bd = 1e9;
      for(i = 0; i < n; i++){
        var ex = cx - nx[i], ey = cyc - ny[i];
        var dd = ex * ex + ey * ey;
        if(dd < bd){ bd = dd; bi = i; }
      }
      if(bi >= 0){
        var gx = cx - nx[bi], gy = cyc - ny[bi], gl = Math.hypot(gx, gy) || 1;
        addNode(nx[bi] + gx / gl * P.step, ny[bi] + gy / gl * P.step, bi, dep[bi] + 1);
        grown = 1;
      }
    }

    var lb = null, fb = null;
    if(links.length){ lb = new Float32Array(links); linkBatches.push(lb); }
    if(stamps.length){ fb = new Float32Array(stamps); fieldBatches.push(fb); }

    var done = (live === 0) || (grown === 0) || iter > 700 || n >= cap - 4;
    return { done: done, live: live, iter: iter, links: lb, stamps: fb };
  }

  return {
    stepOnce: stepOnce,
    finish: function(){
      var weight = new Float32Array(n), reach = new Int32Array(n);
      for(var i = 0; i < n; i++) weight[i] = 1;
      for(i = n - 1; i > 0; i--){
        var p = par[i];
        if(p < 0) continue;
        weight[p] += weight[i];
        if(reach[i] + 1 > reach[p]) reach[p] = reach[i] + 1;
      }
      this.weight = weight; this.reach = reach;
      this.unreached = [];
      for(i = 0; i < P.count; i++) if(alive[i]) this.unreached.push(att[i*2], att[i*2+1]);
    },
    get n(){ return n; },
    nx: nx, ny: ny, par: par, dep: dep,
    linkBatches: linkBatches, fieldBatches: fieldBatches,
    weight: null, reach: null, unreached: []
  };
}

/* ---------------------------------------------------------------- canvas */

var dpr = 1, W = 0, H = 0, scale = 1, ox = 0, oy = 0, grainPat = null;

function project(){
  scale = Math.min(W, H) * 0.42 / P.zoom;
  ox = W / 2;
  oy = H / 2 + (P.roots === 0 ? Math.min(W, H) * 0.06 : 0);
}
function px(x){ return ox + x * scale; }
function py(y){ return oy - y * scale; }

function makeGrain(){
  var s = 128, c = document.createElement('canvas');
  c.width = s; c.height = s;
  var g = c.getContext('2d'), im = g.createImageData(s, s);
  for(var i = 0; i < s * s; i++){
    var v = 110 + Math.random() * 36;
    im.data[i*4] = v; im.data[i*4+1] = v; im.data[i*4+2] = v; im.data[i*4+3] = 255;
  }
  g.putImageData(im, 0, 0);
  grainPat = ctx.createPattern(c, 'repeat');
}

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(2, Math.floor(window.innerWidth * dpr));
  H = Math.max(2, Math.floor(window.innerHeight * dpr));
  canvas.width = W; canvas.height = H;
  ghost.width = W; ghost.height = H;
  tree.width = W; tree.height = H;
  makeGrain();
  project();
}

/* ------------------------------------------------------------- residue */

function paintBatch(batch, stamps){
  gctx.globalCompositeOperation = 'lighter';
  if(batch && batch.length){
    gctx.strokeStyle = 'rgba(150,160,185,' + P.conAlpha.toFixed(4) + ')';
    gctx.lineWidth = Math.max(0.5, 0.62 * dpr);
    gctx.beginPath();
    for(var i = 0; i < batch.length; i += 4){
      gctx.moveTo(px(batch[i]), py(batch[i+1]));
      gctx.lineTo(px(batch[i+2]), py(batch[i+3]));
    }
    gctx.stroke();
  }
  if(stamps && stamps.length){
    gctx.fillStyle = 'rgba(188,178,158,' + P.fieldAlpha.toFixed(4) + ')';
    var s = Math.max(1, 1.0 * dpr);
    for(var j = 0; j < stamps.length; j += 2){
      gctx.fillRect(px(stamps[j]) - s / 2, py(stamps[j+1]) - s / 2, s, s);
    }
  }
  gctx.globalCompositeOperation = 'source-over';
}

function renderGhost(){
  gctx.setTransform(1, 0, 0, 1, 0, 0);
  gctx.clearRect(0, 0, W, H);
  if(!sim) return;
  var k = Math.max(sim.linkBatches.length, sim.fieldBatches.length);
  for(var i = 0; i < k; i++){
    paintBatch(sim.linkBatches[i], sim.fieldBatches[i]);
  }
  if(sim.unreached && sim.unreached.length){
    gctx.globalCompositeOperation = 'lighter';
    gctx.fillStyle = 'rgba(210,200,180,' + Math.min(0.5, P.fieldAlpha * 6).toFixed(4) + ')';
    var s = Math.max(1, 1.1 * dpr);
    for(var j = 0; j < sim.unreached.length; j += 2){
      gctx.fillRect(px(sim.unreached[j]) - s/2, py(sim.unreached[j+1]) - s/2, s, s);
    }
    gctx.globalCompositeOperation = 'source-over';
  }
}

/* ------------------------------------------------------------ filament */

function smoothstep(a, b, x){
  var t = Math.max(0, Math.min(1, (x - a) / Math.max(1e-6, b - a)));
  return t * t * (3 - 2 * t);
}

function renderTree(){
  tctx.setTransform(1, 0, 0, 1, 0, 0);
  tctx.clearRect(0, 0, W, H);
  if(!sim || !sim.reach) return;

  var n = sim.n, reach = sim.reach, weight = sim.weight, par = sim.par, dep = sim.dep;
  var maxDep = 1;
  for(var i = 0; i < n; i++) if(dep[i] > maxDep) maxDep = dep[i];

  var order = new Int32Array(n - 1), m = 0;
  for(i = 1; i < n; i++) order[m++] = i;
  var sArr = new Float32Array(n);
  var lo = P.threshold * 0.45, hi = P.threshold * 1.7;
  for(i = 0; i < n; i++) sArr[i] = smoothstep(lo, hi, reach[i]);
  order.sort(function(a, b){ return sArr[a] - sArr[b]; });

  tctx.lineCap = 'round';
  tctx.globalCompositeOperation = 'lighter';

  for(var q = 0; q < m; q++){
    i = order[q];
    var p = par[i];
    if(p < 0) continue;
    var s = sArr[i];
    var t = (dep[i] / maxDep) * P.hueSpan + P.hueShift;
    var col = pal(t - Math.floor(t), P.palette);
    var ashR = 0.42, ashG = 0.44, ashB = 0.50;
    var R = ashR + (col[0] - ashR) * s;
    var G = ashG + (col[1] - ashG) * s;
    var B = ashB + (col[2] - ashB) * s;
    var alpha = (P.ghostAlpha + (0.92 - P.ghostAlpha) * s) * P.residue;
    if(s > 0.995) alpha = 0.92;
    var w = (0.34 + 2.0 * Math.pow(weight[i], 1 / P.taper) * 0.10) * P.thickness * dpr;
    w = Math.max(0.35 * dpr, Math.min(9 * dpr, w));

    tctx.strokeStyle = 'rgba(' + (R*255|0) + ',' + (G*255|0) + ',' + (B*255|0) + ',' + alpha.toFixed(3) + ')';
    tctx.lineWidth = w;
    tctx.beginPath();
    tctx.moveTo(px(sim.nx[p]), py(sim.ny[p]));
    tctx.lineTo(px(sim.nx[i]), py(sim.ny[i]));
    tctx.stroke();
  }
  tctx.globalCompositeOperation = 'source-over';
}

function paintLiveSegments(from, to){
  tctx.globalCompositeOperation = 'lighter';
  tctx.strokeStyle = 'rgba(210,214,228,0.22)';
  tctx.lineWidth = Math.max(0.6, 0.7 * dpr);
  tctx.beginPath();
  for(var i = from; i < to; i++){
    var p = sim.par[i];
    if(p < 0) continue;
    tctx.moveTo(px(sim.nx[p]), py(sim.ny[p]));
    tctx.lineTo(px(sim.nx[i]), py(sim.ny[i]));
  }
  tctx.stroke();
  tctx.globalCompositeOperation = 'source-over';
}

/* ------------------------------------------------------------- compose */

function compose(){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#060608';
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';
  if(P.residue > 0.01){
    ctx.globalAlpha = P.residue;
    ctx.drawImage(ghost, 0, 0);
  }
  ctx.globalAlpha = 1;
  ctx.drawImage(tree, 0, 0);

  if(P.bloom > 0.01 && typeof ctx.filter === 'string'){
    ctx.filter = 'blur(' + (6 * dpr).toFixed(1) + 'px)';
    ctx.globalAlpha = P.bloom;
    ctx.drawImage(tree, 0, 0);
    ctx.filter = 'none';
    ctx.globalAlpha = 1;
  }

  ctx.globalCompositeOperation = 'source-over';
  if(P.vignette > 0.001){
    var g = ctx.createRadialGradient(W/2, H/2, Math.min(W,H) * 0.18, W/2, H/2, Math.max(W,H) * 0.72);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,' + P.vignette.toFixed(3) + ')');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  if(P.grain > 0.001 && grainPat){
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = P.grain * 3.2;
    ctx.fillStyle = grainPat;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
}

/* ------------------------------------------------------------- driving */

var running = false, lastN = 0, statusEl = document.getElementById('status');

function startSim(){
  project();
  gctx.setTransform(1,0,0,1,0,0); gctx.clearRect(0, 0, W, H);
  tctx.setTransform(1,0,0,1,0,0); tctx.clearRect(0, 0, W, H);
  sim = makeSim();
  lastN = 0;
  running = true;
  statusEl.textContent = 'growing';
}

function tick(){
  if(running && sim){
    var t0 = performance.now(), res = null, rounds = 0;
    while(rounds < 2 && performance.now() - t0 < 20){
      rounds++;
      res = sim.stepOnce();
      paintBatch(res.links, res.stamps);
      if(sim.n > lastN){ paintLiveSegments(Math.max(1, lastN), sim.n); lastN = sim.n; }
      if(res.done) break;
    }
    if(res && res.done){
      running = false;
      sim.finish();
      renderGhost();
      renderTree();
      statusEl.textContent = sim.n.toLocaleString() + ' nodes / ' + res.iter + ' rounds';
    } else if(res){
      statusEl.textContent = 'growing  ' + res.iter + ' / ' + sim.n.toLocaleString();
    }
  }
  compose();
  requestAnimationFrame(tick);
}

/* --------------------------------------------------------------- panel */

var SPEC = [
  { s: 'Cloud' },
  { k: 'shape',     l: 'Shape',        opts: SHAPES },
  { k: 'count',     l: 'Attractors',   min: 300, max: 4000, step: 10,   d: 0 },
  { k: 'radius',    l: 'Extent',       min: 0.3, max: 1.2,  step: 0.005, d: 3 },
  { k: 'aspect',    l: 'Aspect',       min: 0.4, max: 2.0,  step: 0.005, d: 3 },
  { k: 'lobes',     l: 'Lobes',        min: 2,   max: 11,   step: 1,     d: 0 },

  { s: 'Growth' },
  { k: 'roots',     l: 'Origin',       opts: ROOTS },
  { k: 'influence', l: 'Reach',        min: 0.04, max: 0.35, step: 0.002, d: 3 },
  { k: 'kill',      l: 'Consume at',   min: 0.008, max: 0.08, step: 0.001, d: 3 },
  { k: 'step',      l: 'Step',         min: 0.004, max: 0.030, step: 0.0005, d: 4 },
  { k: 'jitter',    l: 'Wander',       min: 0,    max: 0.6,  step: 0.005, d: 3 },
  { k: 'tropism',   l: 'Tropism',      min: -0.4, max: 0.8,  step: 0.005, d: 3 },

  { s: 'Residue' },
  { k: 'considered', l: 'Links kept',  min: 0,    max: 1,    step: 0.01,  d: 2 },
  { k: 'conAlpha',  l: 'Link weight',  min: 0,    max: 0.25, step: 0.001, d: 3 },
  { k: 'fieldAlpha', l: 'Unconsumed field', min: 0, max: 0.08, step: 0.001, d: 3 },
  { k: 'ghostAlpha', l: 'Abandoned branches', min: 0, max: 0.5, step: 0.005, d: 3 },
  { k: 'residue',   l: 'Residue',      min: 0,    max: 1,    step: 0.01,  d: 2 },

  { s: 'Filament' },
  { k: 'threshold', l: 'Survives past', min: 1,   max: 26,   step: 0.1,   d: 1 },
  { k: 'thickness', l: 'Thickness',    min: 0.2,  max: 2.6,  step: 0.01,  d: 2 },
  { k: 'taper',     l: 'Taper',        min: 1.4,  max: 4.5,  step: 0.01,  d: 2 },
  { k: 'bloom',     l: 'Bloom',        min: 0,    max: 1,    step: 0.01,  d: 2 },
  { k: 'palette',   l: 'Palette',      opts: PALETTES },
  { k: 'hueSpan',   l: 'Hue span',     min: 0,    max: 1.2,  step: 0.005, d: 3 },
  { k: 'hueShift',  l: 'Hue origin',   min: 0,    max: 1,    step: 0.005, d: 3 },

  { s: 'Plate' },
  { k: 'zoom',      l: 'Field of view', min: 0.5, max: 2.2,  step: 0.005, d: 3 },
  { k: 'grain',     l: 'Grain',        min: 0,    max: 0.15, step: 0.001, d: 3 },
  { k: 'vignette',  l: 'Vignette',     min: 0,    max: 1,    step: 0.005, d: 3 }
];

var widgets = {}, pending = null;

function onChange(key){
  if(SIM_KEYS[key]){
    clearTimeout(pending);
    pending = setTimeout(startSim, 180);
  } else if(key === 'zoom'){
    project();
    renderGhost();
    renderTree();
  } else {
    renderGhost();
    renderTree();
  }
}

function buildPanel(){
  var host = document.getElementById('controls');
  host.innerHTML = '';
  SPEC.forEach(function(item){
    if(item.s){
      var h = document.createElement('div');
      h.className = 'sect';
      h.textContent = item.s;
      host.appendChild(h);
      return;
    }
    var row = document.createElement('div');
    row.className = 'row';
    var head = document.createElement('div');
    head.className = 'head';
    var lab = document.createElement('label');
    lab.textContent = item.l;
    lab.htmlFor = 'ctl_' + item.k;
    head.appendChild(lab);

    if(item.opts){
      row.appendChild(head);
      var sel = document.createElement('select');
      sel.id = 'ctl_' + item.k;
      item.opts.forEach(function(name, i){
        var o = document.createElement('option');
        o.value = String(i); o.textContent = name;
        sel.appendChild(o);
      });
      sel.addEventListener('input', function(){
        P[item.k] = parseInt(sel.value, 10);
        onChange(item.k);
      });
      row.appendChild(sel);
      widgets[item.k] = { el: sel, kind: 'select' };
    } else {
      var val = document.createElement('div');
      val.className = 'val';
      head.appendChild(val);
      row.appendChild(head);
      var rng = document.createElement('input');
      rng.type = 'range';
      rng.id = 'ctl_' + item.k;
      rng.min = item.min; rng.max = item.max; rng.step = item.step;
      rng.addEventListener('input', function(){
        P[item.k] = parseFloat(rng.value);
        val.textContent = P[item.k].toFixed(item.d);
        onChange(item.k);
      });
      row.appendChild(rng);
      widgets[item.k] = { el: rng, kind: 'range', val: val, d: item.d };
    }
    host.appendChild(row);
  });
}

function syncPanel(){
  Object.keys(widgets).forEach(function(k){
    var w = widgets[k];
    if(w.kind === 'select') w.el.value = String(P[k]);
    else { w.el.value = P[k]; w.val.textContent = Number(P[k]).toFixed(w.d); }
  });
  document.getElementById('seed').value = P.seed;
}

/* ------------------------------------------------------------------ io */

function commitPlate(seedStr){
  newPlate(seedStr);
  syncPanel();
  try{ history.replaceState(null, '', '#' + P.seed); }catch(e){}
  startSim();
}

function savePNG(){
  canvas.toBlob(function(blob){
    if(!blob) return;
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'vestigia_' + P.seed + '.png';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  }, 'image/png');
}

document.getElementById('btnNew').addEventListener('click', function(){ commitPlate(null); });
document.getElementById('btnSave').addEventListener('click', savePNG);
document.getElementById('seed').addEventListener('change', function(e){
  var v = e.target.value.trim();
  if(v) commitPlate(v);
});

window.addEventListener('keydown', function(e){
  if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
  var k = e.key.toLowerCase();
  if(k === 'n') commitPlate(null);
  else if(k === 's') savePNG();
  else if(k === 'h') document.getElementById('panel').classList.toggle('hidden');
  else if(k === 'r'){
    P.residue = P.residue > 0.01 ? 0 : 1;
    syncPanel();
    renderTree();
  }
});

var rt = null;
window.addEventListener('resize', function(){
  clearTimeout(rt);
  rt = setTimeout(function(){
    resize();
    if(sim && !running){ renderGhost(); renderTree(); }
    else startSim();
  }, 220);
});

resize();
buildPanel();
commitPlate((location.hash || '').replace('#', '') || null);
requestAnimationFrame(tick);

})();
</script>
